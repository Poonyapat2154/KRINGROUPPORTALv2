{% extends 'base.html' %}{% block page_title %}Employees{% endblock %}{% block content %}<div class="two-col"><div class="card panel"><h3>Add Employee</h3><form method="post" action="{{ url_for('add_employee') }}"><label>Name</label><input class="form-control" name="name" required><label>Email</label><input class="form-control" name="email" type="email" required><label>Password</label><input class="form-control" name="password" value="password123"><label>Role</label><select class="form-select" name="role"><option>employee</option><option>admin</option></select><label>Department</label><select class="form-select" name="department_id"><option value="">None</option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select><button class="btn btn-primary mt-3">Add Employee</button></form></div><div class="card panel"><h3>Employee List</h3><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ u.department.name if u.department else '-' }}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
