{% extends 'base.html' %}{% block page_title %}Activity Logs{% endblock %}{% block content %}<div class="card panel"><h3>Recent Activity</h3>{% for a in activities %}<div class="timeline"><div class="dot"></div><div><strong>{{ a.action }}</strong><p>{{ a.details }}</p><small>{{ a.created_at.strftime('%Y-%m-%d %H:%M') }} by {{ a.user.name if a.user else 'System' }}</small></div></div>{% endfor %}</div>{% endblock %}
