{% extends 'base.html' %}{% block page_title %}IT Helpdesk{% endblock %}{% block content %}<div class="two-col"><div class="card panel"><h3>Send Help Request</h3><form method="post"><label>Subject</label><input class="form-control" name="subject" required><label>Message</label><textarea class="form-control" name="message" rows="5" required></textarea><button class="btn btn-primary mt-3">Submit Ticket</button></form></div><div class="card panel"><h3>Tickets</h3>{% for t in tickets %}<div class="list-card"><strong>{{ t.subject }}</strong><p>{{ t.message }}</p><small>{{ t.status }} • {{ t.created_at.strftime('%Y-%m-%d') }}</small></div>{% endfor %}</div></div>{% endblock %}
