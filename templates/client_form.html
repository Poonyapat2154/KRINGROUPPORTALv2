{% extends 'base.html' %}{% block title %}{{ mode }} Client | KRINGROUP PORTAL{% endblock %}{% block page_title %}{{ mode }} Client{% endblock %}{% block content %}<div class="card panel form-panel"><form method="post" enctype="multipart/form-data"><div class="row g-3"><div class="col-md-6"><label>Client Name *</label><input class="form-control" name="name" required value="{{ client.name if client else '' }}"></div><div class="col-md-6"><label>Company *</label><input class="form-control" name="company" required value="{{ client.company if client else '' }}"></div><div class="col-md-6"><label>Contact Person</label><input class="form-control" name="contact_person" value="{{ client.contact_person if client else '' }}"></div><div class="col-md-6"><label>Department *</label><select class="form-select" name="department_id" required>{% for d in departments %}<option value="{{ d.id }}" {% if client and client.department_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Client Date *</label><input class="form-control" type="date" name="client_date" required value="{{ client.client_date|datefmt if client else now.strftime('%Y-%m-%d') }}"></div><div class="col-md-6"><label>Status</label><select class="form-select" name="status">{% for s in ['New','In Progress','Completed','On Hold'] %}<option {% if client and client.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Email</label><input class="form-control" name="email" type="email" value="{{ client.email if client else '' }}"></div><div class="col-md-6"><label>Phone</label><input class="form-control" name="phone" value="{{ client.phone if client else '' }}"></div><div class="col-md-12"><label>Project</label><input class="form-control" name="project" value="{{ client.project if client else '' }}"></div><div class="col-md-12"><label>Upload File</label><input class="form-control" type="file" name="file"><small class="text-muted">PDF, Word, Excel, images, CSV supported.</small></div><div class="col-md-12"><label>Notes</label><textarea class="form-control" name="notes" rows="5">{{ client.notes if client else '' }}</textarea></div></div><div class="form-actions"><button class="btn btn-primary"><i class="bi bi-save"></i> Save Client</button><a class="btn btn-light" href="{{ url_for('clients') }}">Cancel</a></div></form></div>{% endblock %}
