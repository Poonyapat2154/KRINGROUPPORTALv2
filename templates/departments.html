{% extends 'base.html' %}{% block page_title %}Departments{% endblock %}{% block content %}<div class="two-col"><div class="card panel"><h3>Add Department</h3><form method="post"><label>Name</label><input class="form-control" name="name" required><label>Description</label><textarea class="form-control" name="description"></textarea><button class="btn btn-primary mt-3">Add</button></form></div><div class="card panel"><h3>Department List</h3>{% for d in departments %}<div class="list-card"><strong>{{ d.name }}</strong><small>{{ d.clients|length }} clients</small><p>{{ d.description }}</p></div>{% endfor %}</div></div>{% endblock %}
