<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | KRINGROUP PORTAL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head><body class="login-body"><div class="login-card"><div class="login-brand"><span>KRI</span><strong>NGROUP</strong><small>PORTAL</small></div><h2>Welcome back</h2><p>Sign in to your company workspace.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for cat,msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}{% endwith %}<form method="post"><label>Email</label><input class="form-control" name="email" type="email" value="admin@kringroup.com" required><label>Password</label><input class="form-control" name="password" type="password" value="admin123" required><button class="btn btn-primary w-100 mt-3"><i class="bi bi-box-arrow-in-right"></i> Sign In</button></form><div class="login-note">Default: admin@kringroup.com / admin123</div></div></body></html>
