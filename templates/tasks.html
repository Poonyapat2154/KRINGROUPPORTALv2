{% extends 'base.html' %}{% block page_title %}Task Management{% endblock %}{% block content %}<div class="two-col"><div class="card panel"><h3>Add Task</h3><form method="post"><label>Task</label><input class="form-control" name="title" required><label>Department</label><select class="form-select" name="department_id"><option value="">General</option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select><label>Due Date</label><input class="form-control" type="date" name="due_date"><label>Status</label><select class="form-select" name="status"><option>Open</option><option>In Progress</option><option>Done</option></select><button class="btn btn-primary mt-3">Add Task</button></form></div><div class="card panel"><h3>Tasks</h3>{% for t in tasks %}<div class="mini-row"><span>{{ t.title }}<br><small>{{ t.department.name if t.department else 'General' }}</small></span><span class="status">{{ t.status }}</span></div>{% endfor %}</div></div>{% endblock %}
